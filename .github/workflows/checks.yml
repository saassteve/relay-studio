name: Relay checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # The desktop shell and the release scripts only run on a Mac, so at least
      # make sure they parse.
      - name: Syntax-check the desktop shell and scripts
        run: |
          for f in desktop/*.cjs desktop/*.js desktop/*.mjs electron-builder.config.cjs; do
            node --check "$f"
          done
          sh -n install.sh
          sh -n scripts/release-mac.sh
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # ffmpeg-static's Linux build lacks the subtitles/drawtext filters used by renders.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run build
      - run: npm test
        env:
          FFMPEG_BIN: /usr/bin/ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          RELAY_BROWSER_CHANNEL: chromium
          FFMPEG_BIN: /usr/bin/ffmpeg
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relay-test-results
          path: test-results/
  # The Mac app itself: the real Electron shell, driven through its own windows
  # (tests/desktop.smoke.mjs). It runs from source, unsigned, and asks for no
  # macOS permissions.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # With the Electron binary this time: the test opens the app.
      - run: npm ci
      # The pinned, checksum-verified FFmpeg build the app runs from source with
      # (desktop/ffmpeg-pins.cjs), kept between runs to spare its publisher.
      - uses: actions/cache@v4
        with:
          path: vendor/ffmpeg/darwin-arm64
          key: ffmpeg-darwin-arm64-${{ hashFiles('desktop/ffmpeg-pins.cjs') }}
      - run: npm run desktop:provision
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relay-desktop-test-results
          path: test-results/
