<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src 'self' mediastream: blob:"
    />
    <title>Relay camera</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font: 12px system-ui;
      }
      .ring {
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        overflow: hidden;
        background: #173e32;
        box-shadow:
          0 0 0 3px #d6f475,
          0 10px 30px #0a251b66;
        -webkit-app-region: drag;
        cursor: grab;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        pointer-events: none;
      }
      .empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #d6f475;
        text-align: center;
        padding: 18px;
        line-height: 1.4;
      }
      .tools {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 99px;
        background: #0f2a20e6;
        opacity: 0;
        transition: opacity 0.15s;
        -webkit-app-region: no-drag;
      }
      body:hover .tools {
        opacity: 1;
      }
      button {
        border: 0;
        border-radius: 99px;
        min-width: 24px;
        height: 24px;
        padding: 0 7px;
        color: #f5f8ec;
        background: transparent;
        font: 600 11px system-ui;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #d6f475;
        color: #173e32;
      }
      button:focus-visible {
        outline: 2px solid #d6f475;
      }
    </style>
  </head>
  <body>
    <div class="ring">
      <video id="video" autoplay muted playsinline></video>
      <div class="empty" id="empty" hidden>Camera unavailable</div>
    </div>
    <div class="tools" role="toolbar" aria-label="Camera bubble">
      <button data-size="s" aria-label="Small bubble">S</button>
      <button data-size="m" aria-label="Medium bubble">M</button>
      <button data-size="l" aria-label="Large bubble">L</button>
      <button id="hide" aria-label="Hide bubble">✕</button>
    </div>
    <script src="bubble.js"></script>
  </body>
</html>
