<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Relay drawing layer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      canvas {
        position: fixed;
        inset: 0;
      }
      body.drawing {
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script src="draw.js"></script>
  </body>
</html>
