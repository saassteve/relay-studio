<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Setting up Relay</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #173e32;
        color: #e9f0de;
        font:
          13px -apple-system,
          system-ui,
          sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      main {
        height: 100%;
        box-sizing: border-box;
        padding: 46px 36px 30px;
        display: flex;
        flex-direction: column;
      }
      .mark {
        width: 38px;
        height: 40px;
        color: #d6f475;
      }
      h1 {
        font-size: 19px;
        font-weight: 650;
        letter-spacing: -0.3px;
        margin: 18px 0 6px;
        color: #fbfdf2;
      }
      p {
        margin: 0;
        line-height: 1.55;
        color: #a9bdb0;
      }
      .bar {
        margin-top: auto;
        height: 6px;
        border-radius: 6px;
        background: #ffffff1a;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 3%;
        background: #d6f475;
        border-radius: 6px;
        transition: width 0.15s;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        font-size: 11px;
        color: #a9bdb0;
        font-variant-numeric: tabular-nums;
      }
      .actions {
        margin-top: auto;
        display: none;
        gap: 8px;
        justify-content: flex-end;
        -webkit-app-region: no-drag;
      }
      body.failed .actions {
        display: flex;
      }
      body.failed .bar,
      body.failed .meta {
        display: none;
      }
      button {
        border: 0;
        border-radius: 7px;
        padding: 9px 14px;
        font:
          600 12px -apple-system,
          system-ui,
          sans-serif;
        cursor: pointer;
        background: #ffffff1a;
        color: #e9f0de;
      }
      #retry {
        background: #d6f475;
        color: #173e32;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 34 36" aria-hidden="true">
        <path d="M3 3h13a15 15 0 0 1 0 30H3V3Z" fill="currentColor" />
        <path d="m12 11 12 7-12 7Z" fill="#173e32" />
      </svg>
      <h1 id="title">Getting Relay ready…</h1>
      <p id="detail">
        Downloading the video engine. This happens once and takes a few seconds.
      </p>
      <div class="bar" role="progressbar" aria-label="Download progress">
        <i id="bar"></i>
      </div>
      <div class="meta"><span id="size"></span><span id="pct">0%</span></div>
      <div class="actions">
        <button id="quit">Quit</button><button id="retry">Try again</button>
      </div>
    </main>
    <script src="engine.js"></script>
  </body>
</html>
