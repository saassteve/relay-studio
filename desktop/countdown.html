<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Relay countdown</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font-family: system-ui;
      }
      .dial {
        position: absolute;
        inset: 20px;
        border-radius: 50%;
        background: #173e32ee;
        color: #f8faf0;
        display: grid;
        place-items: center;
        box-shadow: 0 20px 60px #0a251b66;
        cursor: pointer;
      }
      #n {
        font: 700 96px/1 system-ui;
        color: #d6f475;
        animation: pop 1s ease-out infinite;
      }
      .hint {
        position: absolute;
        bottom: 42px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: #c3d1c6;
      }
      @keyframes pop {
        0% {
          transform: scale(1.25);
          opacity: 0;
        }
        25% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #n {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="dial" id="dial" role="timer" aria-live="assertive">
      <span id="n">3</span>
      <span class="hint">Click to start now · Esc to cancel</span>
    </div>
    <script src="countdown.js"></script>
  </body>
</html>
