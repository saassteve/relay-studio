<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#143d32" />
    <meta
      name="description"
      content="Relay — thoughtful video messages. Record, review and share on your own terms."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Relay — Ideas worth sharing</title>
    <!-- A light or dark choice made in Settings is applied before anything is
         drawn. With no choice, the page follows the system. -->
    <script>
      try {
        var theme = localStorage.getItem("relay-theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>
    <!-- The page colour for the moment before the stylesheet arrives, so a
         dark page never opens with a white flash. -->
    <style>
      html {
        background: #fbfcf8;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          background: #0f1814;
          color-scheme: dark;
        }
      }
      html[data-theme="dark"] {
        background: #0f1814;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
